<!DOCTYPE html>
<html lang="nl">
<style>
h1, h2, h3 {
font-family: Arial, sans-serif;
}

    h1 {
    font-size: 1.8em;
    }

    h2 {
    font-size: 1.5em;
    }

    h3 {
    font-size: 1.4em;
    }


    p {
    font-family: 'Times New Roman', Times, serif;
    font-size: 1.2em;
    }

    .tekst-rood {
    color: red;
    }

    .tekst-groen {
    color: green;
    }

    .tekst-blauw {
    color: blue;
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoofdingen en Paragrafen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Hoofding Niveau 1</h1>
<p class="tekst-rood">Dit is een tekst.</p>

<h2>Hoofding Niveau 2</h2>
<p class="tekst-groen">Dit is een tekst.</p>

<h3>Hoofding Niveau 3</h3>
<p class="tekst-blauw">Dit is een tekst.</p>

</body>
</html>
